name: Build CaptureSample IPA
on: 
  workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Icon Sizes
        run: |
          SRC="CaptureSample/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          sips -z 40 40   "$SRC" --out "CaptureSample/Assets.xcassets/AppIcon.appiconset/Icon40.png"
          sips -z 58 58   "$SRC" --out "CaptureSample/Assets.xcassets/AppIcon.appiconset/Icon58.png"
          sips -z 60 60   "$SRC" --out "CaptureSample/Assets.xcassets/AppIcon.appiconset/Icon60.png"
          sips -z 80 80   "$SRC" --out "CaptureSample/Assets.xcassets/AppIcon.appiconset/Icon80.png"
          sips -z 87 87   "$SRC" --out "CaptureSample/Assets.xcassets/AppIcon.appiconset/Icon87.png"
          sips -z 120 120 "$SRC" --out "CaptureSample/Assets.xcassets/AppIcon.appiconset/Icon120.png"
          sips -z 180 180 "$SRC" --out "CaptureSample/Assets.xcassets/AppIcon.appiconset/Icon180.png"
          sips -z 1024 1024 "$SRC" --out "CaptureSample/Assets.xcassets/AppIcon.appiconset/Icon1024.png"

      - name: Build Unsigned iOS Application
        run: |
          xcodebuild clean build \
            -project CaptureSample.xcodeproj \
            -scheme CaptureSample \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            SYMROOT=$(PWD)/build
          
          mkdir Payload
          mv build/Debug-iphoneos/CaptureSample.app Payload/
          zip -r CaptureSample.ipa Payload
      
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaptureSample-App
          path: CaptureSample.ipa
