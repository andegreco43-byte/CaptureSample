<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <!-- Apple Squircle Background Gradient -->
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1f2937" />
            <stop offset="100%" stop-color="#111827" />
        </linearGradient>
        
        <!-- Shutter Blade Gradients for Depth -->
        <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0369a1" />
        </linearGradient>

        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="100%" stop-color="#0891b2" />
        </linearGradient>
        
        <!-- Subtle Glow Filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- iOS Icon Base (Slightly rounded rectangle to preview fit) -->
    <rect width="1024" height="1024" rx="225" fill="url(#bgGradient)" />

    <!-- Outer Tech Ring (Capturing Aesthetic) -->
    <circle cx="512" cy="512" r="320" fill="none" stroke="#374151" stroke-width="8" opacity="0.5"/>
    <circle cx="512" cy="512" r="290" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="20 15" opacity="0.7"/>

    <!-- Focal Lens Outer Shell -->
    <circle cx="512" cy="512" r="240" fill="#1f2937" filter="url(#glow)" />
    <circle cx="512" cy="512" r="236" fill="none" stroke="#4b5563" stroke-width="6" />

    <!-- Stylized Camera Aperture Blades (Capture Theme) -->
    <g transform="translate(512, 512)">
        <!-- Blade 1 -->
        <path d="M 0,-180 L 120,-120 L 40,40 L -100,-40 Z" fill="url(#bladeGrad)" opacity="0.95" />
        <!-- Blade 2 -->
        <path d="M 0,-180 L 120,-120 L 40,40 L -100,-40 Z" fill="url(#bladeGrad)" opacity="0.95" transform="rotate(72)" />
        <!-- Blade 3 -->
        <path d="M 0,-180 L 120,-120 L 40,40 L -100,-40 Z" fill="url(#bladeGrad)" opacity="0.95" transform="rotate(144)" />
        <!-- Blade 4 -->
        <path d="M 0,-180 L 120,-120 L 40,40 L -100,-40 Z" fill="url(#bladeGrad)" opacity="0.95" transform="rotate(216)" />
        <!-- Blade 5 -->
        <path d="M 0,-180 L 120,-120 L 40,40 L -100,-40 Z" fill="url(#bladeGrad)" opacity="0.95" transform="rotate(288)" />
    </g>

    <!-- Inner Core Glass Elements -->
    <circle cx="512" cy="512" r="90" fill="#0f172a" />
    <circle cx="512" cy="512" r="86" fill="none" stroke="#67e8f9" stroke-width="3" opacity="0.6" />
    
    <!-- Central Sensor Dot -->
    <circle cx="512" cy="512" r="25" fill="#22d3ee" />

    <!-- Sleek Lens Flares / Reflections -->
    <path d="M 360,360 Q 420,330 512,340" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.35" />
    <path d="M 380,380 Q 430,355 490,365" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.2" />
    <path d="M 630,650 Q 580,680 520,670" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.25" />
</svg>
